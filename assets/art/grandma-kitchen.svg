<linearGradient id="steam2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFF9EA" stop-opacity="0"/><stop offset=".5" stop-color="#FFF9EA" stop-opacity=".75"/><stop offset="1" stop-color="#FFF9EA" stop-opacity="0"/></linearGradient>
</defs>
