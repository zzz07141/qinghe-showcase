<linearGradient id="q3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3DFB4"/><stop offset="1" stop-color="#E0B47C"/></linearGradient>
<linearGradient id="q4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9E2E4"/><stop offset="1" stop-color="#EFF1EA"/></linearGradient>
</defs>
